name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container: rust:${{ matrix.distro }}

    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        distro:
          - bookworm
          - trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev python3

      - name: Build Debian package
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          ./packaging/build-deb.sh

      - name: Verify packaged kiosk
        run: |
          apt-get install -y --no-install-recommends ./dist-artifacts/*.deb xvfb python3-aiohttp
          cargo test --locked --release
          python3 packaging/smoke-test.py /usr/bin/streambot-touch

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: streambot-touch-${{ matrix.distro }}-${{ matrix.runner }}
          path: dist-artifacts/*.deb
