name: Release Assets

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container: rust:${{ matrix.distro }}

    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        distro:
          - bookworm
          - trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev python3

      - name: Build Debian package
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          ./packaging/build-deb.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.deb
